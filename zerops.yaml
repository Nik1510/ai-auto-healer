zerops:
  # Backend API Configuration
  - setup: backend
    build:
      base: nodejs@20
      buildCommands:
        - cd backend && npm install
        - cd backend && npx prisma generate
      deployFiles:
        - backend/package.json
        - backend/node_modules
        - backend/dist
        - backend/prisma
    run:
      base: nodejs@20
      ports:
        - port: 5000
          httpSupport: true
      start: npm start

  # Frontend Dashboard Configuration
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install
        - cd frontend && npm run build
      deployFiles:
        - frontend/.next
        - frontend/public
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/node_modules
        - frontend/next.config.js
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start -- -H 0.0.0.0 -p 3000