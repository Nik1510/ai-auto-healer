zerops:
  # Backend API Configuration
  - setup: backend
    build:
      base: nodejs@20
      buildCommands:
        - cd backend && npm install
        - cd backend && npx prisma generate
        - cd backend && npm run build
      deployFiles:
        - backend/package.json
        - backend/node_modules
        - backend/dist
        - backend/prisma
    run:
      base: nodejs@20
      ports:
        - port: 5000
          httpSupport: true
      start: npm start

  # Frontend Dashboard Configuration
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install
        - cd frontend && npm run build
      deployFiles:
        - frontend/.next/standalone/frontend/.
        - frontend/.next/standalone/node_modules
        - frontend/.next/static
        - frontend/public
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: HOSTNAME="0.0.0.0" PORT=3000 node server.js